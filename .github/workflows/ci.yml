name: CI

# Runs on every pull request and on pushes to main. Pull requests get the
# full test suite plus a lightweight end-to-end pipeline run so a broken
# pipeline cannot be merged.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Lightweight pipeline run
        run: |
          python run_pipeline.py
          python run_monitoring.py

      - name: Build serving image
        run: docker build -t house-price-api:ci --build-arg GIT_COMMIT=${{ github.sha }} .
