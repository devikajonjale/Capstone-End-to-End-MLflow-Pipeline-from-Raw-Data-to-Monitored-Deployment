# Single source of truth for the house price pipeline.
# Nothing in the code should hard-code a path, threshold or hyperparameter.
# Every value below is read through src/config_loader.py and validated on load.

project:
  name: house_price_prediction
  version: 1.1.0

data:
  raw_train_path: datasets/project4_capstone/capstone_house_prices_train.csv
  incoming_batches_path: datasets/project4_capstone/capstone_incoming_batches.csv
  processed_dir: data/processed
  results_dir: data/results

feature_engineering:
  target: Price_Lakhs
  id_cols:
    - House_ID
    - Batch
  numeric_features:
    - Area_sqft
    - Bedrooms
    - Bathrooms
    - Age_Years
    - Distance_to_Center_km
    - Neighborhood_Score
    - Has_Parking
  categorical_features:
    - Property_Condition
    - City_Zone
  imputation:
    strategy_numeric: median
    strategy_categorical: most_frequent

# Multi-algorithm training. All candidates below are run under 5-fold
# cross-validation, every run is logged to MLflow, and the one with the
# lowest mean CV RMSE is selected as the champion. The model gate then
# evaluates that champion against the incumbent production model.
model:
  model_type: random_forest   # kept for backward compatibility (first candidate's name)
  test_size: 0.2
  random_state: 42
  cv:
    n_splits: 5
  candidates:
    - name: random_forest
      hyperparameters:
        n_estimators: 300
        max_depth: 18
        min_samples_split: 4
        min_samples_leaf: 2
    - name: gradient_boosting
      hyperparameters:
        n_estimators: 300
        max_depth: 5
        learning_rate: 0.05
        subsample: 0.9
    - name: ridge
      hyperparameters:
        alpha: 1.0
  # Legacy hyperparameters key, used only if `candidates` is missing.
  hyperparameters:
    n_estimators: 200
    max_depth: 15
    min_samples_split: 5
    min_samples_leaf: 2

# DATA GATE. A batch that breaks any of these rules is rejected and the
# production model keeps serving unchanged.
data_gate:
  max_missing_pct: 0.10          # at most 10 percent missing per column
  required_columns:
    - House_ID
    - Area_sqft
    - Bedrooms
    - Bathrooms
    - Age_Years
    - Distance_to_Center_km
    - Neighborhood_Score
    - Has_Parking
    - Property_Condition
    - City_Zone
  value_ranges:
    Area_sqft: {min: 100, max: 5000}
    Bedrooms: {min: 1, max: 10}
    Bathrooms: {min: 1, max: 10}
    Age_Years: {min: 0, max: 150}
    Distance_to_Center_km: {min: 0.0, max: 100.0}
    Neighborhood_Score: {min: 1.0, max: 10.0}
    Has_Parking: {min: 0, max: 1}

# MODEL GATE. A freshly trained champion is promoted only when it clears the
# absolute quality bar (RMSE, MAE, R2, MAPE) AND beats the incumbent model
# within a small tolerance (Champion vs Challenger).
model_gate:
  max_rmse: 12.0
  max_mae: 8.5
  min_r2: 0.80
  max_mape: 0.20
  rmse_tolerance: 0.5

# MONITORING. Drift is measured with the Population Stability Index (PSI).
# PSI below 0.1 is stable, 0.1 to 0.2 is a moderate shift worth watching,
# and above 0.2 is a material shift that raises an alert.
monitoring:
  psi_warn: 0.10
  psi_alert: 0.20
  performance_alert_ratio: 1.25
  bins: 10

mlflow:
  experiment_name: house_price_prediction
  tracking_uri: sqlite:///mlflow.db
  model_name: house_price_model

# Where the promoted model and its lineage record are written.
registry:
  production_dir: models/production

serving:
  host: 0.0.0.0
  port: 8000
  # Confidence interval reported alongside each prediction. For a RandomForest
  # champion the width is derived from the standard deviation of per-tree
  # predictions; other models fall back to the training RMSE as a prior.
  confidence_z: 1.96
