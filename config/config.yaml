# Single source of truth for the house price pipeline.
# Nothing in the code should hard-code a path, threshold or hyperparameter.
# Every value below is read through src/config_loader.py and validated on load.

project:
  name: house_price_prediction
  version: 1.0.0

data:
  raw_train_path: datasets/project4_capstone/capstone_house_prices_train.csv
  incoming_batches_path: datasets/project4_capstone/capstone_incoming_batches.csv
  processed_dir: data/processed
  results_dir: data/results

feature_engineering:
  target: Price_Lakhs
  id_cols:
    - House_ID
    - Batch
  numeric_features:
    - Area_sqft
    - Bedrooms
    - Bathrooms
    - Age_Years
    - Distance_to_Center_km
    - Neighborhood_Score
    - Has_Parking
  categorical_features:
    - Property_Condition
    - City_Zone
  imputation:
    strategy_numeric: median
    strategy_categorical: most_frequent

model:
  model_type: random_forest
  test_size: 0.2
  random_state: 42
  hyperparameters:
    n_estimators: 200
    max_depth: 15
    min_samples_split: 5
    min_samples_leaf: 2

# DATA GATE. A batch that breaks any of these rules is rejected and the
# production model keeps serving unchanged.
data_gate:
  max_missing_pct: 0.10          # at most 10 percent missing per column
  required_columns:
    - House_ID
    - Area_sqft
    - Bedrooms
    - Bathrooms
    - Age_Years
    - Distance_to_Center_km
    - Neighborhood_Score
    - Has_Parking
    - Property_Condition
    - City_Zone
  value_ranges:
    Area_sqft: {min: 100, max: 5000}
    Bedrooms: {min: 1, max: 10}
    Bathrooms: {min: 1, max: 10}
    Age_Years: {min: 0, max: 150}
    Distance_to_Center_km: {min: 0.0, max: 100.0}
    Neighborhood_Score: {min: 1.0, max: 10.0}
    Has_Parking: {min: 0, max: 1}

# MODEL GATE. A freshly trained model is promoted only when it clears the
# absolute quality bar AND is at least as good as the model already in
# production (within a small tolerance).
model_gate:
  max_rmse: 18.0
  max_mae: 13.0
  min_r2: 0.65
  # a new model may be at most this much worse (in RMSE) than production
  # and still be allowed through. A value of 0.5 means "no worse by more
  # than 0.5 lakhs". Set below zero to force a strict improvement.
  rmse_tolerance: 0.5

# MONITORING. Drift is measured with the Population Stability Index (PSI).
# PSI below 0.1 is stable, 0.1 to 0.2 is a moderate shift worth watching,
# and above 0.2 is a material shift that raises an alert.
monitoring:
  psi_warn: 0.10
  psi_alert: 0.20
  # performance alert: raise if batch RMSE is worse than training RMSE by
  # more than this factor (1.25 means 25 percent worse).
  performance_alert_ratio: 1.25
  bins: 10

mlflow:
  experiment_name: house_price_prediction
  tracking_uri: sqlite:///mlflow.db
  model_name: house_price_model

# Where the promoted model and its lineage record are written. This folder
# is committed so the serving container is self-contained.
registry:
  production_dir: models/production

serving:
  host: 0.0.0.0
  port: 8000
